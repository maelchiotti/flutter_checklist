name: flutter_checklist
description: "A widget to display a checklist with checkable and reorderable items"

repository: https://github.com/maelchiotti/flutter_checklist
issue_tracker: https://github.com/maelchiotti/flutter_checklist/issues

version: 2.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true